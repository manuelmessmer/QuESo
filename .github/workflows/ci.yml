name: CI

on:
  pull_request:
    branches: ["main"]

# for cancelling redundant runs
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      QUESO_DEBUG: "1"
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          
      - name: Build
        run: |
          cmake --preset linux -DQUESO_BUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_FLAGS="${{ matrix.build-type == 'Debug' && '-Og' || '' }}"
          cmake --build --preset linux --target install _core test_queso test_queso_thingi10k --verbose

      - name: Install Python dependencies
        run: |
          python3 -m pip install numpy scipy pytest

      - name: Test py
        run: |
          ./out/build/linux/bin/run_tests py

      - name: Test cpp
        run: ./out/build/linux/bin/run_tests cpp

  windows:
    runs-on: windows-2022
    env:
      QUESO_BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake --preset win -DQUESO_BUILD_TESTING=ON
          cmake --build --preset win --target install _core test_queso test_queso_thingi10k

      - name: Install Python dependencies
        run: |
          python -m pip install numpy scipy pytest

      - name: Test py
        run: out\build\win\bin\run_tests.cmd py
        shell: cmd

      - name: Test cpp
        run: out\build\win\bin\run_tests.cmd cpp
        shell: cmd
